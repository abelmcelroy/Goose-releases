name: Site

on:
  release:
    types: [published, unpublished, deleted]

permissions: {}

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions: {contents: read}
    steps:
      - if: github.event.action == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: until gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx goose-update.json; do sleep 60; done
      - env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          [ -n "$HOOK" ] || { echo "The secret SITE_DEPLOY_HOOK is missing, so the site wasn't rebuilt: add it as Goose-website's README says." >&2; exit 1; }
          curl -fsS -X POST "$HOOK"
